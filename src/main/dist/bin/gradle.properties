#
# Properties of the Gradle build performing the setup of Silverpeas. They apply whatever the way
# the setup is launched (the silverpeas script for Unix-like systems, silverpeas.bat for Windows).
#

# Level of the traces output by Gradle itself. QUIET silences the traces about the tasks Gradle
# executes so that only the traces about the Silverpeas setup are printed out. (Those traces of
# Gradle were previously silenced by the silversetup plugin through the Gradle#useLogger(Object)
# method, now deprecated.)
# To get more details about a setup, pass the --info or the --debug option to the silverpeas
# command: any logging option on the command line takes precedence over this property.
org.gradle.logging.level=quiet

# The setup is a one-shot task: no Gradle daemon has to be spawned and then to be left running once
# the setup is done.
org.gradle.daemon=false
